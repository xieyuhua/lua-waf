; ============================================================
; wafadmin 配置文件
; 运行模式：
;   demo  —— 内存仓储 + 内置演示数据，无需 MySQL，开箱即用
;   dev   —— 连接 MySQL，输出详细日志
;   prod  —— 连接 MySQL，用于生产环境
; ============================================================
RUN_MODE = prod
;RUN_MODE = demo
;RUN_MODE = dev

[server]
HTTP_PORT = 5002
; 多台 WAF 之间同步配置时使用的共享密钥，必须与所有节点一致
API_KEY = change-me-please
NGINX_BIN = /www/server/nginx/sbin/nginx
NGINX_VHOSTS = /www/server/panel/vhost/nginx/
; 站点证书目录，按站点域名建立子目录（fullchain.pem / privkey.pem）
SSL_CERT_DIR = /www/server/panel/vhost/cert
; 集群内的其他 WAF 节点，逗号分隔
API_SERVERS = 127.0.0.1

[database]
USER = waf
PASSWD = waf
HOST = 192.168.2.6
PORT = 3306
NAME = waf
; 仅当表不存在时才自动建表；已存在的表不做任何结构同步（不会 ALTER 线上表）
; 设为 false 则完全不自动建表，需自行初始化库表
AUTO_MIGRATE = true
; 对已存在的表只补充缺失列（只增不改删），从 1.x 老库升级时开启；默认 false
ADD_MISSING_COLUMNS = true
; 打印每条执行的 SQL（含参数与耗时），排障用；后台可热切换
SHOW_SQL = false

[waf]
; lua-waf 的 config.lua 路径（后台「系统设置 → WAF 配置」可在线修改）
; 生产环境通常是 /www/server/nginx/x-waf/config.lua
LUA_CONFIG = lua-waf/config.lua
; 攻击地图的防护目标位置（用于绘制攻击箭头）
MAP_TARGET = 中国-北京
; lua 侧规则目录（下发规则文件写入此目录，需与 nginx 机器一致）
RULE_PATH = /www/server/nginx/x-waf/rules/
; 「从规则文件同步」的候选目录：后台与 nginx 不同机时，指向本机规则目录（RULE_PATH 不可读时使用）
RULE_IMPORT_DIR = lua-waf/rules
LOG_DIR = /www/wwwlogs/waf

[pager]
PAGEMax = 10

[security]
; 会话签名密钥，留空则每次启动随机生成（重启后需重新登录）
SESSION_SECRET =
SESSION_TTL = 12h
; 通过 HTTPS 访问时设为 true
SESSION_SECURE = false
CAPTCHA_TTL = 5m

[monitor]
; 后台自身 SQL 超过该耗时（毫秒）即记录为慢 SQL
SLOW_SQL_MS = 200
[log]
; 日志入库方式：lua 只写 Redis，由本进程消费后批量写 MySQL（config.lua 里 config_log_mode = "redis"
; 且 config_redis_consume = "off"，二者配合使用）
INGEST_ENABLED = off
REDIS_ADDR = 127.0.0.1:6379
REDIS_PASSWORD =
REDIS_DB = 0
; 与 config.lua 的 config_redis_list_key 保持一致
REDIS_LIST_KEY = waf:logs
INGEST_BATCH = 200
INGEST_BLOCK_MS = 2000
