user  nginx;
worker_processes auto;
worker_cpu_affinity auto;

#error_log  logs/error.log;
#error_log  logs/error.log  debug;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  409600;
}

http {
    include       mime.types;
	
	
	
lua_package_path "/www/server/nginx/x-waf/?.lua;/usr/local/lib/lua/?.lua;;";
lua_shared_dict limit 100m;
lua_shared_dict badGuys 100m;
-- 自动封禁表（命中攻击达到阈值后写入，TTL 到期自动解封）
lua_shared_dict waf_bans 20m;
-- 异步日志：内存缓冲队列 + 计数器/落库锁
lua_shared_dict waf_log_queue 20m;
lua_shared_dict waf_log_meta  1m;
#开启lua代码缓存功能
lua_code_cache on;
init_by_lua_file /www/server/nginx/x-waf/init.lua;
init_worker_by_lua_file /www/server/nginx/x-waf/init_worker.lua;
access_by_lua_file /www/server/nginx/x-waf/access.lua;
	
	
	
	
	
	
    default_type  application/octet-stream;


    #log_format shield_access    '$remote_addr - $http_host - "$request" - "$http_cookie"';
    #access_log pipe:/usr/local/shield/redisclient shield_access;
    
    #ssl on;
    #ssl_certificate certs/cert_chain.crt;
    #ssl_certificate_key certs/server.key;
    ssl_session_timeout     5m;
    ssl_protocols SSLv2 SSLv3 TLSv1;
    ssl_ciphers ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
    ssl_prefer_server_ciphers on;


    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;
 
    #gzip  on;
    include vhosts/*.conf;

    server {
        listen       80;
        server_name  localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        location / {
            root   html;
            index  index.html index.htm;
        	}
        }
}
